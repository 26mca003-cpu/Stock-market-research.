submission:
  title: "Vriddhi — AI Stock Research Platform"
  problem_statement: >
    Indian retail investors must combine delayed market data, financial statements,
    corporate filings, news, and technical indicators across disconnected sources.
    This makes research slow and inconsistent and increases the risk of missing
    governance or financial-quality signals.
  solution_summary: >
    Vriddhi is a web platform that brings Indian-stock research into one workflow.
    Its FastAPI backend gathers public market and filing data, applies a transparent
    six-layer scoring framework, and produces sanitized educational research that
    the Next.js dashboard presents with traceable metrics and disclaimers.
  key_features:
    - "Six-layer deterministic scoring across business quality, financial strength, valuation, governance, growth, and technical setup"
    - "Indian market data, news, corporate announcements, and filing extraction in one research workflow"
    - "AI-assisted summaries with output sanitization and mandatory educational disclaimers"
    - "Interactive stock research dashboard with charts, score bands, red flags, comparison, watchlists, and portfolios"
    - "Scheduled ingestion jobs and cached data to reduce repeated upstream requests"
  tech_stack:
    languages: ["Python", "TypeScript", "SQL"]
    frameworks: ["FastAPI", "Next.js", "React", "Tailwind CSS"]
    ibm_technologies: []
    databases: ["Supabase/PostgreSQL"]
    other: ["yfinance", "Google Gemini API", "Groq API", "Vercel", "Render", "Genspark AI", "Crawl4AI", "cron-job.org"]
  what_we_are_most_proud_of: >
    The strongest part of Vriddhi is its explainable research model: every score is
    decomposed into named layers and metrics, while the platform explicitly avoids
    buy, sell, hold, and price-target language so the prototype stays educational
    and auditable.
  known_limitations: >
    Free-tier market data may be delayed; upstream BSE/NSE and filing sources can
    rate-limit requests; some small-cap companies have sparse disclosures; and the
    optional AI providers require user-supplied API credentials.

